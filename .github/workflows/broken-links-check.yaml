name: Check for broken links
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  broken-link-check:
    name: Check for broken links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      # Install the versions recorded in package-lock.json. The scraper's OpenAPI
      # command does not use Puppeteer, so avoid downloading its browser binaries.
      - name: Install locked dependencies
        run: npm ci --include=dev
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Generate API docs
      - name: Generate API docs
        run: ./node_modules/.bin/mintlify-scrape openapi-file https://api.galileo.ai/public/v2/openapi.json -o api-reference
        timeout-minutes: 10
      # Check for broken links
      - name: Run broken-link check
        run: |
          set -o pipefail
          ./node_modules/.bin/mint broken-links 2>&1 | tee broken-links.log

          if grep -Eqi "Invalid hook call|Cannot read properties of null|(^|[[:space:]])ERROR([[:space:]]|:)" broken-links.log; then
            echo "Mint reported a runtime error while checking links."
            exit 1
          fi

          if ! grep -Fq "success no broken links found" broken-links.log; then
            echo "Mint did not report a successful broken-link check."
            exit 1
          fi
