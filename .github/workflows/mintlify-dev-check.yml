# .github/workflows/mintlify-dev-check.yml

name: Mintlify Dev Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  mintlify-dev:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    name: Check Mintlify Dev Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --include=dev
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Run Mintlify Dev (Short Test)
        id: dev_test
        run: |
          set +e
          timeout 120s npm run dev > dev.log 2>&1
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 124 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            cat dev.log
          elif grep -Eqi "Invalid hook call|Cannot read properties of null|(^|[[:space:]])ERROR([[:space:]]|:)" dev.log; then
            echo "status=failed" >> $GITHUB_OUTPUT
            cat dev.log
          elif ! grep -Fq "preview ready" dev.log; then
            echo "status=failed" >> $GITHUB_OUTPUT
            cat dev.log
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Upload Dev Log (for debug)
        id: upload_log
        if: steps.dev_test.outputs.status == 'failed'
        uses: actions/upload-artifact@v4
        with:
          name: mintlify-dev-log
          path: dev.log

      - name: Comment Dev Failure on PR
        if: steps.dev_test.outputs.status == 'failed' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mintlify-dev
          message: |
            ❌ Mintlify Dev Server Failed!
            
            Download the [dev log here](${{ steps.upload_log.outputs.artifact-url }}) for more details.

      - name: Set Job Status to Failure
        if: steps.dev_test.outputs.status == 'failed'
        run: |
          echo "Job failed due to previous errors."
          exit 1

      - name: Comment Success on PR
        if: steps.dev_test.outputs.status == 'success' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mintlify-dev
          message: |
            ✅ Mintlify Dev Server Started Successfully!
            
            The documentation can be served without errors.
