name: Check Card Links

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run link checker
        run: |
          python .github/workflows/check_card_links.py --root . --timeout 10 --verbose