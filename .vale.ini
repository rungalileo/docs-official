StylesPath = "./vale/styles"

# Here's were we define the exceptions to use in *all*
# `BasedOnStyles`.
Vocab = Galileo-Vocab

[*]
# 'Vale' and 'MyStyle' automatically respect all
# custom exceptions.
#
# The built-in 'Vale' style is required for using
# `Vale.Terms`, `Vale.Avoid`, or `Vale.Spelling`.
BasedOnStyles = Vale