# =============================================================================
# GALILEO ERROR CATALOG
# =============================================================================
#
# This file contains the canonical error definitions for the Galileo platform.
# Each error entry includes error codes, messages, user actions, and metadata
# used for classification, documentation, and customer-facing error display.
#
# Error Code Ranges (see ERROR_CODE_RANGES.md for details):
#   - 1000-1999: Shared & customer-facing errors (used across all features)
#   - 2000-2499: Metrics-specific errors
#   - 2500-2999: Tokenomics errors
#   - 3000-3499: Playground errors
#   - 3500-3999: Experiment errors
#   - 4000-4499: Dataset errors
#   - 5000-5499: Signals errors
#   - 6000-6499: Protect (security/guardrails) errors
#   - 7000-7499: Integrations errors
#   - 7500-7999: Provider management API integration errors
#   - 8000-8499: Annotation queue errors
#   - 8500-8999: Authentication errors (SSO, SAML, etc.)
#   - 9000-9499: Component view errors
#   - 9500-9999: Authorization errors (Cerbos, etc.)
#   - 10000-10499: User preferences errors
#   - 10500-10999: Logstream errors
#   - 11000-11499: Organization errors
#   - 12000-12499: AI Assistant errors
#
# Schema: See ErrorCatalogEntry model in orbit/libs/python/error_management/models/
#
# =============================================================================
# ⚠️  REQUIRED FIELDS FOR ALL ERROR ENTRIES
# =============================================================================
#
# The following 6 fields are REQUIRED for every error entry. Missing any of
# these fields will cause validation failures and result in poor SDK/UI
# experience for customers.
#
# REQUIRED FIELDS:
#   1. error_code: int
#      - Unique numeric identifier (e.g., 1000, 1001, 2000, 3000)
#      - Must be within the correct range for the error_group
#
#   2. error_type: ErrorType
#      - Enum value: credentials_error, llm_api_error, data_validation_error,
#        system_error, not_found_error, configuration_error, uncataloged_error
#
#   3. error_group: str
#      - Feature grouping: "shared", "metrics", "playground", "dataset", "signals"
#      - Must match the error_code range (e.g., 2000-2499 → "metrics")
#
#   4. severity: ErrorSeverity
#      - Enum value: "low", "medium", "high", "critical"
#      - Used for UI ordering and alerting
#
#   5. default_message: str
#      - Customer-facing error message (fallback if no custom message)
#      - Should be clear, actionable, and user-friendly
#      - Never expose raw Python/third-party exception messages
#
#   6. user_action: str
#      - Concise guidance shown to customers (e.g., "Retry in 60 seconds")
#      - Used for UI buttons and call-to-action text
#      - Critical for good customer experience
#
# OPTIONAL FIELDS (but recommended):
#   - http_status_code: int (preferred HTTP status, e.g., 401, 404, 422)
#   - exception_class: str (dotted path, e.g., "setgalileo.exceptions.data.DataError")
#   - message_patterns: List[str] (regex patterns for classification)
#   - documentation_link: HttpUrl (link to public docs)
#   - retriable: bool (default: false)
#   - blocking: bool (default: false)
#   - telemetry_tags: List[str] (for analytics)
#
# VALIDATION:
#   - All entries are validated against ErrorCatalogEntry schema on startup
#   - Missing required fields will cause catalog load failure
#   - Invalid error_code ranges will be caught by tests
#   - Duplicate error_codes will be caught by validation
#
# =============================================================================

# =============================================================================
# SECTION 1: SHARED ERRORS (1000-1999)
# =============================================================================
#
# Description: Common errors used across all features (Metrics, Playground,
#              Experiments, Dataset, Signals). These are high-frequency errors that
#              affect multiple features.
#
# When to add here:
#   - Authentication/authorization failures
#   - LLM provider errors (rate limits, timeouts, parsing)
#   - System/infrastructure errors
#   - Resource not found errors
#   - Data validation errors that apply to multiple features
#
# =============================================================================

- error_code: 1000
  error_type: uncataloged_error
  error_group: shared
  severity: high
  default_message: An unexpected error occurred. Our team has been notified.
  user_action: Please retry or contact support with the error details.
  retriable: false
  telemetry_tags: ["fallback"]

# Authentication failures (API + integrations)
- error_code: 1001
  error_type: credentials_error
  error_group: shared
  severity: high
  default_message: Authentication failed. Check your credentials and try again.
  user_action: Verify API keys or credentials in integration settings.
  http_status_code: 401
  exception_class: setgalileo.exceptions.credentials.CredentialsError
  message_patterns:
    - "authentication"
    - "invalid api key"
    - "unauthorized"
    - "expired credential"
    - "401"
  telemetry_tags: ["auth"]

# Rate limit / quota exceeded
- error_code: 1002
  error_type: llm_api_error
  error_group: shared
  severity: high
  default_message: The AI provider rate-limited the request.
  user_action: Retry later, or contact the AI provider to raise your rate limit.
  retriable: true
  http_status_code: 429
  message_patterns:
    - "rate limit"
    - "quota exceeded"
    - "too many requests"
    - "usage limit"
  telemetry_tags: ["ratelimit"]

# Context window / payload too large
- error_code: 1003
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: Payload exceeds the provider's context window.
  user_action: Shorten the prompt or split it into smaller requests.
  message_patterns:
    - "context.*limit"
    - "token limit"
    - "input too long"
    - "max_tokens"
  telemetry_tags: ["context"]

# Provider response malformed (JSON parse, missing attributes)
- error_code: 1004
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: LLM Provider response could not be parsed.
  user_action: Retry the job; if this recurs, contact support with the run ID.
  retriable: true
  blocking: false
  exception_class: json.decoder.JSONDecodeError
  message_patterns:
    - "failed to parse json"
    - "jsondecodeerror"
    - "failed to parse response"
    - "failed to extract response"
    - "missing completion"
    - "attribute error"
  telemetry_tags: ["parsing"]

# Transient transport errors (timeouts, connection issues)
- error_code: 1005
  error_type: system_error
  error_group: shared
  severity: medium
  default_message: Temporary connectivity issue communicating with the provider.
  user_action: Retry the request; check provider status if it persists.
  retriable: true
  blocking: true
  message_patterns:
    - "timeout"
    - "connection refused"
    - "connect error"
    - "readtimeout"
    - "socket.gaierror"
  telemetry_tags: ["transport"]

# Resource not found (job, project, scorer, etc.)
- error_code: 1006
  error_type: not_found_error
  error_group: shared
  severity: medium
  default_message: The requested resource could not be found.
  user_action: Verify the identifier and try again.
  http_status_code: 404
  message_patterns:
    - "not found"
    - "does not exist"
    - "missing"
  telemetry_tags: ["notfound"]

# Integration Configuration Error (e.g., Databricks, Azure)
- error_code: 1007
  error_type: credentials_error
  error_group: shared
  severity: high
  default_message: Integration credentials are invalid or expired.
  user_action: Update the integration credentials and retry.
  message_patterns:
    - "databricks.*auth"
    - "token invalid"
    - "integration.*authentication"
  telemetry_tags: ["integrations"]

# Generic Configuration/Validation Error (e.g., bad input, resource conflict)
- error_code: 1008
  error_type: system_error
  error_group: shared
  severity: high
  default_message: Temporary issue fetching insights. Please retry shortly.
  user_action: Retry after a few minutes or contact support if it persists.
  retriable: true
  message_patterns:
    - "clickhouse"
    - "database connection"
    - "failed to fetch data"
  telemetry_tags: ["infra"]

# Data Ingestion Error
- error_code: 1009
  error_type: system_error
  error_group: shared
  severity: high
  default_message: Data ingestion failed due to an internal error.
  user_action: Retry the operation; if it persists, contact support with the run ID.
  retriable: false
  blocking: true
  exception_class: api.api.exceptions.data_ingestion_exception.DataIngestionException
  telemetry_tags: ["ingestion"]

# Internal HTTP Error (e.g., GalileoHTTPException)
- error_code: 1010
  error_type: system_error
  error_group: shared
  severity: high
  default_message: Internal HTTP request failed while processing this job.
  user_action: Retry the request; if the issue continues, contact support.
  retriable: true
  blocking: true
  exception_class: galileo_core.exceptions.http.GalileoHTTPException
  telemetry_tags: ["http"]

# Already shared with target
- error_code: 1011
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: The resource is already shared with the specified user or group.
  user_action: Consider updating the existing share permissions instead.
  http_status_code: 422

# Professional email validation
- error_code: 1012
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: Personal email providers are not allowed.
  user_action: Work email is required to create an account.
  http_status_code: 422

# Endpoint does not support email-based sharing
- error_code: 1013
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: This endpoint does not support sharing via user_email; please provide user_id.
  user_action: Use user_id instead of user_email for this endpoint.
  http_status_code: 422
  message_patterns:
    - "does not support.*user_email"
    - "provide user_id"
  telemetry_tags: ["collaboration", "validation"]

# Same user specified with conflicting roles
- error_code: 1014
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: The request references the same user multiple times.
  user_action: Ensure each user is specified only once.
  http_status_code: 422
  telemetry_tags: ["collaboration", "validation"]

# Configuration error (SSL, client setup, system configuration)
- error_code: 1015
  error_type: configuration_error
  error_group: shared
  severity: high
  default_message: A configuration error prevented the operation from completing.
  user_action: Check your integration configuration and retry.
  retriable: false
  exception_class: setgalileo.exceptions.configuration.ConfigurationError
  telemetry_tags: ["configuration"]

# Data validation error (mismatched lengths, invalid types, missing outputs)
- error_code: 1016
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: Input data failed validation checks.
  user_action: Check your input data format and retry.
  retriable: false
  exception_class: setgalileo.exceptions.data.DataError
  telemetry_tags: ["data_validation"]

# Shared with an invalid role
- error_code: 1017
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: Invalid role specified in share request.
  user_action: Make sure the role is one of the allowed values.
  http_status_code: 422
  message_patterns:
    - "invalid role"
  telemetry_tags: ["collaboration", "validation"]

# SSRF: URL host resolves to a disallowed internal address
- error_code: 1018
  error_type: data_validation_error
  error_group: shared
  severity: high
  default_message: The URL resolves to a disallowed internal address.
  user_action: Use a publicly routable URL or update the GALILEO_SSRF_BLOCKED_IP_RANGES setting.
  http_status_code: 422
  retriable: false
  telemetry_tags: ["ssrf", "url_validation"]

# SSRF: URL host could not be resolved
- error_code: 1019
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: The URL's host could not be resolved.
  user_action: Check the URL is correct and its domain is publicly resolvable.
  http_status_code: 422
  retriable: false
  telemetry_tags: ["ssrf", "url_validation"]

# SMTP: Authentication failed with configured mail credentials
- error_code: 1020
  error_type: configuration_error
  error_group: shared
  severity: high
  default_message: SMTP authentication failed; the configured mail credentials were rejected.
  user_action: Verify GALILEO_EXT_SMTP_USERNAME / PASSWORD and the service account's relay permissions.
  http_status_code: 422
  telemetry_tags: ["smtp", "email", "configuration"]

# Could not publish a task to the broker (RabbitMQ) because it is unreachable or
# applying flow control, so the bounded publish timed out. Used by any service
# that enqueues background work.
- error_code: 1021
  error_type: system_error
  error_group: shared
  severity: high
  default_message: Could not queue background work because the messaging service is temporarily unavailable.
  user_action: Please retry in a few moments; if it persists, contact support.
  retriable: true
  http_status_code: 503
  telemetry_tags: ["queue", "publish"]

# Provider model is invalid, unavailable, or retired for this integration/region.
# Distinct from 1005 (transient transport): this is a configuration/model-availability problem
# and retrying will not help until the model selection or integration is corrected.
- error_code: 1022
  error_type: configuration_error
  error_group: shared
  severity: high
  default_message: The selected provider model is invalid or unavailable for this integration.
  user_action: Choose a different model, or ensure the model (and any required inference profile) is enabled for your integration and region.
  retriable: false
  blocking: true
  message_patterns:
    - "provided model identifier is invalid"
    - "model version has reached the end of its life"
    - "invalid model identifier"
  telemetry_tags: ["provider", "model"]

# Endpoint unsupported when O11y Cloud integration is enabled
- error_code: 1023
  error_type: configuration_error
  error_group: shared
  severity: medium
  default_message: This endpoint is not available on O11y Cloud. Use the GDI ingestion endpoint.
  user_action: Send telemetry through the O11y Cloud GDI ingestion endpoint.
  http_status_code: 404
  telemetry_tags: ["o11y_cloud", "unsupported_endpoint"]

# ClickHouse query-governance pool saturated: a governed flow waited out its
# acquire window (or was shed at admission) with the concurrency budget full.
# Retriable backpressure. Ops action: scale/tune the flow's N budget.
- error_code: 1024
  error_type: system_error
  error_group: shared
  severity: medium
  default_message: The analytics query service is at capacity; please retry shortly.
  user_action: Please retry in a few moments.
  retriable: true
  http_status_code: 429
  telemetry_tags: ["clickhouse", "concurrency_control", "saturated"]

# ClickHouse query-governance coordinator (Redis) unavailable while a governed
# flow ran fail-closed. Retriable. Ops action: fix Redis (distinct from 1024).
- error_code: 1025
  error_type: system_error
  error_group: shared
  severity: high
  default_message: The analytics query service is temporarily unavailable; please retry shortly.
  user_action: Please retry in a few moments.
  retriable: true
  http_status_code: 503
  telemetry_tags: ["clickhouse", "concurrency_control", "coordinator_unavailable"]

# =============================================================================
# SECTION 2: METRICS ERRORS (2000-2499)
# =============================================================================
#
# Description: Errors specific to the Metrics feature. These include scorer
#              configuration errors, metric computation failures, and metrics-
#              specific validation errors.
#
# When to add here:
#   - Scorer configuration/misconfiguration errors
#   - Metric computation failures
#   - Metrics-specific validation errors
#   - Batch/job processing errors in metrics context
#
# =============================================================================

# Metrics-specific: Scorer misconfiguration
- error_code: 2000
  error_type: data_validation_error
  error_group: metrics
  severity: high
  default_message: Metric job failed due to missing scorer settings.
  user_action: Provide scorer settings for this job and retry.
  http_status_code: 422
  message_patterns:
    - "scorer settings not found"
    - "task type not found"
    - "invalid scorer config"
  telemetry_tags: ["metrics"]

# Metrics-specific: Invalid JSON format in request parameters
- error_code: 2001
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Invalid JSON format in request parameter.
  user_action: Check that filters and sort parameters are valid JSON.
  http_status_code: 422
  message_patterns:
    - "invalid json format"
    - "json decode error"
    - "JSONDecodeError"
  telemetry_tags: ["metrics", "validation"]

# Metrics-specific: Scorer file size exceeded
- error_code: 2002
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Scorer file exceeds maximum allowed size of 1 MB.
  user_action: Reduce the scorer file size and try again.
  http_status_code: 413
  message_patterns:
    - "file exceeds maximum"
    - "file too large"
    - "size limit exceeded"
  telemetry_tags: ["metrics", "validation"]

# Metrics-specific: Invalid request parameter value
- error_code: 2003
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Invalid request parameters.
  user_action: Check your request parameters and try again.
  http_status_code: 422
  message_patterns:
    - "invalid.*parameter"
    - "invalid starting_token"
    - "must be an integer"
  telemetry_tags: ["metrics", "validation"]

# Metrics-specific: Scorer version mismatch
- error_code: 2004
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: The scorer version does not belong to the specified scorer.
  user_action: Verify that the scorer version ID matches the scorer and try again.
  http_status_code: 422
  message_patterns:
    - "does not belong to scorer"
    - "scorer version.*mismatch"
  telemetry_tags: ["metrics", "scorer_feedback"]

# Metrics-specific: Scorer feedback queue locked
- error_code: 2005
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Cannot perform this operation while the metric feedback queue is not accepting new feedback.
  user_action: Please either let the feedback queue finish applying to the metric, or abort the generating/reviewing feedback queue.
  http_status_code: 409
  message_patterns:
    - "queue is"
    - "feedback queue is"
    - "non-pending queue"
    - "cannot add feedback"
    - "cannot create scorer version"
  telemetry_tags: ["metrics", "scorer_feedback"]

# Metrics-specific: Custom scorer code validation failed
- error_code: 2006
  error_type: workflow_error
  error_group: metrics
  severity: medium
  default_message: Custom scorer validation failed.
  user_action: Check your custom scorer code for errors.
  retriable: false
  telemetry_tags: ["metrics", "scorer_validation"]

# Metrics-specific: Scorer name conflicts with reserved auxiliary metric suffix
- error_code: 2007
  error_type: data_validation_error
  error_group: metrics
  severity: low
  http_status_code: 422
  default_message: Scorer name conflicts with a reserved Galileo metric suffix.
  user_action: >
    Rename your scorer to avoid names ending with reserved suffixes.
    Reserved suffixes are used internally by Galileo to store metric metadata
    (e.g., _status, _error_message, _explanation, _rationale, _metric_cost).
    Choose a name that does not end with any of these.
  retriable: false
  telemetry_tags: ["metrics", "scorer_validation"]

# Metrics-specific: Model server connection or timeout error
- error_code: 2008
  error_type: system_error
  error_group: metrics
  severity: high
  default_message: The scoring model is temporarily unavailable.
  user_action: Please retry. If the issue persists, contact support.
  retriable: true
  telemetry_tags: ["metrics", "model_server"]

# --- Metric N/A reason codes (informational, not errors) ---

# Metrics-specific: Required input data missing for metric computation
- error_code: 2009
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: Required input data for this metric is missing.
  user_action: Ensure all required fields (e.g., ground truth, tools) are provided for this metric.
  retriable: false
  telemetry_tags: ["metrics", "missing_input"]

# Metrics-specific: Record returned an error, metric skipped
- error_code: 2010
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: This record returned an error, so the metric cannot be computed.
  user_action: Investigate the error on the original record. Metrics are computed once the record succeeds.
  retriable: false
  telemetry_tags: ["metrics", "record_error"]

# Metrics-specific: Record excluded by metric sampling settings
- error_code: 2011
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: This record was excluded by metric sampling settings.
  user_action: Adjust your sampling rules if you want this record scored.
  retriable: false
  telemetry_tags: ["metrics", "sampling"]

# Metrics-specific: No child spans eligible for this metric
- error_code: 2012
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: No child spans are eligible for this metric.
  user_action: Check that child spans match the metric's required types.
  retriable: false
  telemetry_tags: ["metrics", "structural"]

# Metrics-specific: Metric does not apply to this record type
- error_code: 2013
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: This metric does not apply to this record type.
  user_action: This metric only applies to specific span types. No action needed.
  retriable: false
  telemetry_tags: ["metrics", "type_mismatch"]

# Metrics-specific: Record excluded by metric filter condition
- error_code: 2014
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: This record was excluded by a metric filter condition.
  user_action: Adjust the metric's filter conditions if you want this record scored.
  retriable: false
  telemetry_tags: ["metrics", "filter"]

# Metrics-specific: Metric does not support rollup from children
- error_code: 2015
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: This metric does not aggregate scores from child spans.
  user_action: See individual child spans for their scores.
  retriable: false
  telemetry_tags: ["metrics", "rollup"]

# Metrics-specific: Recompute exceeds maximum allowed steps
- error_code: 2016
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Cannot recompute metrics because the number of matching steps exceeds the allowed limit.
  user_action: Refine your filters to reduce the number of steps before recomputing metrics.
  http_status_code: 422
  retriable: false
  telemetry_tags: ["metrics", "recompute", "limit"]

# Metrics-specific: LLM Provider file upload failed
- error_code: 2017
  error_type: llm_api_error
  error_group: metrics
  severity: high
  default_message: File upload(s) to LLM Provider failed.
  user_action: Update LLM Provider configuration.
  retriable: false
  telemetry_tags: ["metrics", "file_upload"]

# Metrics-specific: Record has file modalities unsupported by the metric
- error_code: 2018
  error_type: not_applicable_reason
  error_group: metrics
  severity: low
  default_message: This metric does not support the file modalities attached to this record.
  user_action: Use metrics that provide the required multimodal capabilities for files attached to this record.
  retriable: false
  telemetry_tags: ["metrics", "multimodal"]

# Metrics-specific: Trace is structurally incomplete (a span references a parent that has not
# been ingested), so its metrics cannot be computed until the trace is whole. Retrying/recomputing
# is a no-op while incomplete — only the missing span arriving resolves it.
- error_code: 2019
  error_type: data_validation_error
  error_group: metrics
  severity: low
  default_message: Metrics were not computed because the trace is structurally incomplete — one or more spans reference a parent that has not been ingested.
  user_action: No action needed. Metrics will be computed automatically once the missing span(s) arrive and the trace is complete.
  retriable: false
  telemetry_tags: ["metrics", "structural"]


# Metrics-specific: Metric computation timed out (e.g. Celery soft/hard time limit hit
# while a slow or unavailable scoring model was being retried)
- error_code: 2020
  error_type: system_error
  error_group: metrics
  severity: high
  default_message: Metric computation timed out before it could finish.
  user_action: This usually means the scoring model was slow or temporarily unavailable. Please retry; if it persists, contact support.
  retriable: true
  telemetry_tags: ["metrics", "timeout"]

# Metrics-specific: generic fallback for internal metric failures that the EMS classifier doesn't
# otherwise catalog. Covers both the metrics controller / scorer job creation (e.g. object-store
# upload denied, run-info fetch failed) and scorer execution / row-level failures raised by a raw
# or third-party exception. The concrete root-cause message is still surfaced alongside this code.
- error_code: 2021
  error_type: system_error
  error_group: metrics
  severity: high
  default_message: Metric computation failed due to an internal error.
  user_action: Please retry; if it persists, check the error details and contact support.
  retriable: true
  telemetry_tags: ["metrics", "controller"]

# Metrics-specific: provider rejected execution because the saved model is retired,
# missing, or no longer available.
- error_code: 2022
  error_type: llm_api_error
  error_group: metrics
  severity: high
  default_message: The selected model is no longer available from the provider.
  user_action: Update the saved metric or prompt to use an available model, then rerun.
  retriable: false
  blocking: true
  message_patterns:
    - "model.*not found"
    - "model.*not available"
    - "model.*retired"
    - "model.*deprecated"
    - "no longer available"
  telemetry_tags: ["metrics", "model_lifecycle"]

# Metrics-specific: the metric was never scored in time. The hourly self-heal sweep re-enqueues
# a record whose metric sits non-terminal (pending/computing), but after a bounded number of
# attempts it gives up and stamps this terminal state so the metric stops spinning and the
# customer can retry. Distinct from 2020 (the scorer *ran* and hit its time limit) — here the
# computation never completed at all (job-creation backlog / stuck non-terminal until give-up).
- error_code: 2023
  error_type: system_error
  error_group: metrics
  severity: high
  default_message: This metric was not scored in time and was stopped.
  user_action: Please retry; if it persists, contact support.
  retriable: true
  telemetry_tags: ["metrics", "not_scored_in_time"]

# Metrics-specific: the session roll-up aggregate query timed out while aggregating a session's
# child scores into session-level scores. The roll-up is not retried (the same O(run-size) scan
# would just time out again and storm), so the affected rolled-up metrics are marked failed with
# this code instead of being left pending and silently vanishing. Marked retriable because it is
# not permanent — a later child-metric write, or the hourly self-heal sweep re-driving the
# children, supersedes this failed row via ReplacingMergeTree — but note the roll-up is NOT
# retried automatically on this path, so user_action must not promise automatic retry.
#
# INTERIM CODE (SAO-16181 / RFC 1.7): introduced ahead of SAO-16180 / RFC 1.5, which splits
# pipeline timeouts into per-cause codes. RFC 1.5 owns reconciling this entry — folding the
# roll-up / DB-query-timeout cause into its scheme. Do not treat 2024 as permanent.
- error_code: 2024
  error_type: system_error
  error_group: metrics
  severity: high
  default_message: Session-level scores could not be computed because roll-up timed out while aggregating this session's child scores.
  user_action: This roll-up was not retried automatically. It may recover when the session's child scores are next re-driven (the hourly self-heal sweep) or a later child write supersedes it; if it persists, rerun the affected run or contact support.
  retriable: true
  telemetry_tags: ["metrics", "timeout", "session_rollup"]

