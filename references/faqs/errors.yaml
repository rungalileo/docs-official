  severity: high
  default_message: The authorization service is temporarily unavailable.
  user_action: Please retry in a few moments. If the problem persists, contact your administrator to verify the health of the authorization service.
  http_status_code: 503
  retriable: true
  telemetry_tags: ["authz", "authorization"]

# =============================================================================
# SECTION 12: USER PREFERENCES ERRORS (10000-10499)
# =============================================================================
#
# Description: Errors specific to adding or updating user preferences.
#
# When to add here:
#   - Adding or updating user preferences
#   - User preferences validation errors
#   - User preferences not found errors
#
# =============================================================================

# User preference scope validation (project_id, run_id mismatch)
- error_code: 10000
  error_type: data_validation_error
  error_group: user_preferences
  severity: medium
  default_message: Invalid preference scope. For project-scoped preferences, include project_id and either log_stream_id or experiment_id. For global preferences, omit them.
  user_action: Check the scope rules and provide only the IDs required for that scope.
  http_status_code: 400
  telemetry_tags: ["user_preferences", "validation"]

# Only admins can set global preferences
- error_code: 10001
  error_type: configuration_error
  error_group: user_preferences
  severity: medium
  default_message: Only organization admins can set global preferences.
  user_action: Ask an org admin to update the global preferences.
  http_status_code: 403
  telemetry_tags: ["user_preferences", "authorization"]

# Can only set preferences for yourself
- error_code: 10002
  error_type: configuration_error
  error_group: user_preferences
  severity: medium
  default_message: You can only set preferences for your own account.
  user_action: Use your own user account when updating preferences.
  http_status_code: 403
  telemetry_tags: ["user_preferences", "authorization"]

# User preference not found
- error_code: 10003
  error_type: not_found_error
  error_group: user_preferences
  severity: low
  default_message: User preference not found.
  user_action: Please save the user preferences first and try again.
  http_status_code: 404
  telemetry_tags: ["user_preferences"]

# User preference conflict (concurrent unique constraint race)
- error_code: 10004
  error_type: data_validation_error
  error_group: user_preferences
  severity: medium
  default_message: Preference already exists.
  user_action: Please retry updating the preference again.
  http_status_code: 409
  retriable: true
  telemetry_tags: ["user_preferences", "conflict"]

# =============================================================================
# SECTION 13: LOGSTREAM ERRORS (10500-10999)
# =============================================================================
#
# Description: Logstream-specific errors (ingestion, queries, configuration).
#
# When to add here:
#   - Log stream name conflicts or duplicate name errors
#   - Project type validation (log stream cannot be created in project type)
#   - Ingestion or query failures
#   - Failed to load a newly created log stream
#   - Logstream-specific validation or configuration errors
#
# =============================================================================

# Log stream name already exists
- error_code: 10500
  error_type: data_validation_error
  error_group: logstream
  severity: medium
  default_message: A log stream with this name already exists for this project.
  user_action: Please use another name.
  http_status_code: 400
  message_patterns:
    - "log stream.*already exists"
  telemetry_tags: ["logstream"]

# Log stream task type cannot be created in project type
- error_code: 10501
  error_type: data_validation_error
  error_group: logstream
  severity: medium
  default_message: Log stream cannot be created in this project type.
  user_action: Use a different project that supports log streams.
  http_status_code: 400
  message_patterns:
    - "log stream.*task type"
    - "log stream.*cannot be created"
  telemetry_tags: ["logstream"]

# Failed to load created log stream
- error_code: 10502
  error_type: system_error
  error_group: logstream
  severity: high
  default_message: Failed to load created log stream.
  user_action: Retry the operation; if it persists, contact support.
  http_status_code: 500
  telemetry_tags: ["logstream"]

# =============================================================================
# SECTION 14: ORGANIZATION ERRORS (11000-11499)
# =============================================================================
#
# Description: Organization-level errors (settings, membership, limits, etc.).
#
# When to add here:
#   - Organization not found or invalid
#   - Organization membership or role validation errors
#   - Organization settings or configuration errors
#   - Organization-level limits or quota errors
#
# =============================================================================

# Organization slug exceeds maximum length
- error_code: 11000
  error_type: data_validation_error
  error_group: organization
  severity: medium
  default_message: Organization name results in a slug that is too long.
  user_action: Use a shorter organization name and try again.
  http_status_code: 422
  message_patterns:
    - "slug.*too long"
    - "organization name.*too long"
  telemetry_tags: ["organization", "validation"]
