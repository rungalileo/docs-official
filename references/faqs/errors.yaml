#   - Component view validation errors
#   - Component view not found errors
#   - Component view duplicate name errors
#   - Component view visibility and deletion restrictions
#
# =============================================================================

# Component view not found
- error_code: 9000
  error_type: not_found_error
  error_group: component_view
  severity: medium
  default_message: The view does not exist in the current project, or you do not have access to it.
  user_action: Go back to your project and select an existing view, or create a new one.
  http_status_code: 404
  message_patterns:
    - "view does not exist.*does not belong.*project"
    - "does not belong to the current project"
    - "current user does not have access.*view"
    - "does not have access to this view"
    - "component view.*not found"
  telemetry_tags: ["component_view"]

# Component view run not found
- error_code: 9001
  error_type: not_found_error
  error_group: component_view
  severity: medium
  default_message: The requested view could not be found.
  user_action: Please verify and try again.
  http_status_code: 404
  message_patterns:
    - "component view run.*not found"
    - "run.*not found.*component view"
  telemetry_tags: ["component_view"]

# Component view run belongs to different project
- error_code: 9002
  error_type: data_validation_error
  error_group: component_view
  severity: medium
  default_message: The view does not belong to this resource.
  user_action: Please choose a different view.
  http_status_code: 422
  message_patterns:
    - "run.*belongs to.*different project"
    - "component view run.*different project"
  telemetry_tags: ["component_view", "validation"]

# Component view project ID mismatch
- error_code: 9003
  error_type: data_validation_error
  error_group: component_view
  severity: medium
  default_message: The view does not belong to the current project.
  user_action: Please choose a valid view for the current project.
  http_status_code: 422
  message_patterns:
    - "project.*id.*mismatch"
    - "component view.*project.*mismatch"
  telemetry_tags: ["component_view", "validation"]

# Component view duplicate name
- error_code: 9004
  error_type: data_validation_error
  error_group: component_view
  severity: medium
  default_message: A view with this name already exists in this project.
  user_action: Please try with a different name for this view.
  http_status_code: 400
  message_patterns:
    - "component view.*name.*already exists"
    - "component view.*already exists"
  telemetry_tags: ["component_view"]

# Component view cannot change visibility from project to user
- error_code: 9005
  error_type: data_validation_error
  error_group: component_view
  severity: medium
  default_message: Cannot change the view from project-level to user-level.
  user_action: Create a new user-level view instead of changing visibility from Project to User.
  http_status_code: 422
  message_patterns:
    - "cannot change.*visibility.*project.*user"
    - "visibility.*cannot.*change"
  telemetry_tags: ["component_view", "validation"]

# Component view cannot delete default
- error_code: 9006
  error_type: data_validation_error
  error_group: component_view
  severity: medium
  default_message: Cannot delete the default view.
  user_action: Set a different view as default before deleting this one.
  http_status_code: 422
  message_patterns:
    - "cannot delete.*default"
    - "default.*cannot.*delete"
  telemetry_tags: ["component_view", "validation"]

# Component view cannot change visibility of default
- error_code: 9007
  error_type: data_validation_error
  error_group: component_view
  severity: medium
  default_message: Cannot change visibility of the default view.
  user_action: Set a different view as default before changing visibility of this one.
  http_status_code: 400
  message_patterns:
    - "cannot change.*visibility.*default"
    - "visibility.*default.*cannot.*change"
  telemetry_tags: ["component_view", "validation"]

# Component view belongs to a different user
- error_code: 9008
  error_type: permission_error
  error_group: component_view
  severity: medium
  default_message: The current user does not have access to this view.
  user_action: Please choose a view you own or a project-visible view.
  http_status_code: 404
  message_patterns:
    - "current user does not have access to this view"
    - "view.*belongs to (a )?different user"
  telemetry_tags: ["component_view", "authorization"]

# =============================================================================
# SECTION 11: AUTHORIZATION ERRORS (9500-9999)
# =============================================================================
#
# Description: Authorization service (e.g., Authz) errors—unavailability,
#              request failures, and policy evaluation failures.
#
# =============================================================================

# Authorization service (Authz) unavailable or request failed
- error_code: 9500
  error_type: system_error
  error_group: authorization
  severity: high
  default_message: The authorization service is temporarily unavailable.
  user_action: Please retry in a few moments. If the problem persists, contact your administrator to verify the health of the authorization service.
  http_status_code: 503
  retriable: true
  telemetry_tags: ["authz", "authorization"]

# =============================================================================
# SECTION 12: USER PREFERENCES ERRORS (10000-10499)
# =============================================================================
#
# Description: Errors specific to adding or updating user preferences.
#
# When to add here:
#   - Adding or updating user preferences
#   - User preferences validation errors
#   - User preferences not found errors
#
# =============================================================================

# User preference scope validation (project_id, run_id mismatch)
- error_code: 10000
  error_type: data_validation_error
  error_group: user_preferences
  severity: medium
  default_message: Invalid preference scope. For project-scoped preferences, include project_id and either log_stream_id or experiment_id. For global preferences, omit them.
  user_action: Check the scope rules and provide only the IDs required for that scope.
  http_status_code: 400
  telemetry_tags: ["user_preferences", "validation"]

# Only admins can set global preferences
- error_code: 10001
  error_type: configuration_error
  error_group: user_preferences
  severity: medium
  default_message: Only organization admins can set global preferences.
  user_action: Ask an org admin to update the global preferences.
  http_status_code: 403
  telemetry_tags: ["user_preferences", "authorization"]

# Can only set preferences for yourself
- error_code: 10002
  error_type: configuration_error
  error_group: user_preferences
  severity: medium
  default_message: You can only set preferences for your own account.
  user_action: Use your own user account when updating preferences.
  http_status_code: 403
  telemetry_tags: ["user_preferences", "authorization"]

# User preference not found
- error_code: 10003
  error_type: not_found_error
  error_group: user_preferences
  severity: low
  default_message: User preference not found.
  user_action: Please save the user preferences first and try again.
  http_status_code: 404
  telemetry_tags: ["user_preferences"]

# User preference conflict (concurrent unique constraint race)
- error_code: 10004
  error_type: data_validation_error
  error_group: user_preferences
  severity: medium
  default_message: Preference already exists.
  user_action: Please retry updating the preference again.
  http_status_code: 409
  retriable: true
  telemetry_tags: ["user_preferences", "conflict"]

# =============================================================================
# SECTION 13: LOGSTREAM ERRORS (10500-10999)
# =============================================================================
#
# Description: Logstream-specific errors (ingestion, queries, configuration).
#
# When to add here:
#   - Log stream name conflicts or duplicate name errors
#   - Project type validation (log stream cannot be created in project type)
#   - Ingestion or query failures
#   - Failed to load a newly created log stream
#   - Logstream-specific validation or configuration errors
#
# =============================================================================

# Log stream name already exists
- error_code: 10500
  error_type: data_validation_error
  error_group: logstream
  severity: medium
  default_message: A log stream with this name already exists for this project.
  user_action: Please use another name.
  http_status_code: 400
  message_patterns:
    - "log stream.*already exists"
  telemetry_tags: ["logstream"]

# Log stream task type cannot be created in project type
- error_code: 10501
  error_type: data_validation_error
  error_group: logstream
  severity: medium
  default_message: Log stream cannot be created in this project type.
  user_action: Use a different project that supports log streams.
  http_status_code: 400
  message_patterns:
    - "log stream.*task type"
    - "log stream.*cannot be created"
  telemetry_tags: ["logstream"]

# Failed to load created log stream
- error_code: 10502
  error_type: system_error
  error_group: logstream
  severity: high
  default_message: Failed to load created log stream.
  user_action: Retry the operation; if it persists, contact support.
  http_status_code: 500
  telemetry_tags: ["logstream"]

# Unknown column requested in log stream query
- error_code: 10503
  error_type: data_validation_error
  error_group: logstream
  severity: medium
  default_message: Unknown column requested in log stream query.
  user_action: Check the column names in your query and try again.
  http_status_code: 400
  telemetry_tags: ["logstream"]


# =============================================================================
# SECTION 14: ORGANIZATION ERRORS (11000-11499)
# =============================================================================
#
# Description: Organization-level errors (settings, membership, limits, etc.).
#
# When to add here:
#   - Organization not found or invalid
#   - Organization membership or role validation errors
#   - Organization settings or configuration errors
#   - Organization-level limits or quota errors
#
# =============================================================================

# Organization slug exceeds maximum length
- error_code: 11000
  error_type: data_validation_error
  error_group: organization
  severity: medium
  default_message: Organization name results in a slug that is too long.
  user_action: Use a shorter organization name and try again.
  http_status_code: 422
  message_patterns:
    - "slug.*too long"
    - "organization name.*too long"
  telemetry_tags: ["organization", "validation"]

# Organization external ID already belongs to another organization
- error_code: 11001
  error_type: data_validation_error
  error_group: organization
  severity: medium
  default_message: Organization already exists.
  user_action: Use a different organization external ID or update the existing organization.
  http_status_code: 409
  message_patterns:
    - "organization.*already exists"
  telemetry_tags: ["organization", "provisioning", "conflict"]

# System user external ID already belongs to another system user
- error_code: 11002
  error_type: data_validation_error
  error_group: organization
  severity: medium
  default_message: System user already exists.
  user_action: Use a different system user external ID or update the existing system user.
  http_status_code: 409
  message_patterns:
    - "system user.*already exists"
  telemetry_tags: ["organization", "provisioning", "conflict"]

# Organization membership already exists
- error_code: 11003
  error_type: data_validation_error
  error_group: organization
  severity: medium
  default_message: Organization membership already exists.
  user_action: Update the existing organization membership instead of creating a new one.
  http_status_code: 409
  message_patterns:
    - "organization membership.*already exists"
  telemetry_tags: ["organization", "membership", "provisioning", "conflict"]

# Concurrent creation race left a project transiently unresolvable
- error_code: 11004
  error_type: system_error
  error_group: organization
  severity: low
  default_message: The project is being created concurrently. Please retry.
  user_action: Retry the request; the concurrent creation should resolve on the next attempt.
  retriable: true
  http_status_code: 500
  telemetry_tags: ["organization", "provisioning", "concurrency", "retriable"]


# =============================================================================
# SECTION 15: AI ASSISTANT ERRORS (12000-12499)
# =============================================================================
#
# Description: Errors raised by the AI assistant feature.
#
# When to add here:
#   - Errors surfaced during AI assistant operations
#
# =============================================================================

# No LLM integration configured for the model the assistant is trying to use
- error_code: 12000
  error_type: configuration_error
  error_group: assistant
  severity: high
  default_message: No LLM integration is configured for the assistant.
  user_action: Configure an LLM integration in your organization settings.
  exception_class: setgalileo.exceptions.credentials.CredentialsError
  telemetry_tags: ["assistant", "configuration"]

# Conversation history exceeds the model's context limit
- error_code: 12002
  error_type: data_validation_error
  error_group: assistant
  severity: medium
  default_message: The conversation history exceeds the model's context limit.
  user_action: Start a new conversation to continue.
  telemetry_tags: ["assistant", "context"]

# Conversation not found or not owned by the requesting user
- error_code: 12003
  error_type: not_found_error
  error_group: assistant
  severity: low
  default_message: Conversation not found.
  user_action: Refresh the page and try again. If the issue persists, contact support.
  http_status_code: 404
  telemetry_tags: ["assistant"]

# Invalid or expired pagination cursor for conversation messages
- error_code: 12004
  error_type: data_validation_error
  error_group: assistant
  severity: low
  default_message: Invalid pagination cursor.
  user_action: Reload the conversation and try again.
  http_status_code: 400
  telemetry_tags: ["assistant"]

# Assistant message isn't found or not accessible by the requesting user
- error_code: 12005
  error_type: not_found_error
  error_group: assistant
  severity: low
  default_message: Message not found.
  user_action: Refresh the page and try again.
  http_status_code: 404
  telemetry_tags: ["assistant"]

# Assistant turn timed out waiting for the runner to start
- error_code: 12006
  error_type: system_error
  error_group: assistant
  severity: high
  default_message: The assistant did not respond in time.
  user_action: Retry your message.
  retriable: true
  telemetry_tags: ["assistant", "timeout"]

# Assistant turn timed out mid-stream (runner went idle or hard cap exceeded)
- error_code: 12007
  error_type: system_error
  error_group: assistant
  severity: high
  default_message: The assistant turn timed out.
  user_action: Retry your message.
  retriable: true
  telemetry_tags: ["assistant", "timeout"]

# Selected model does not support the assistant (no function calling or incompatible provider)
- error_code: 12008
  error_type: configuration_error
  error_group: assistant
  severity: high
  default_message: The selected model does not support the AI assistant.
  user_action: Select a different model to use with the AI assistant.
  exception_class: setgalileo.exceptions.configuration.ConfigurationError
  message_patterns:
    - "does not support agentic"
    - "not support.*streaming"
    - "not found.*endpoint"
    - "model or endpoint not found"
  telemetry_tags: ["assistant", "configuration"]

# Message already submitted or a turn is already in progress for this conversation
- error_code: 12009
  error_type: data_validation_error
  error_group: assistant
  severity: low
  default_message: This request conflicts with an existing message or active turn.
  user_action: Refresh the page and try again.
  http_status_code: 409
  telemetry_tags: ["assistant"]

# LLM request timed out before the provider opened the stream or stopped mid-stream
- error_code: 12010
  error_type: system_error
  error_group: assistant
  severity: medium
  default_message: The model did not respond in time.
  user_action: Retry your message. If this keeps happening, try a different model.
  retriable: true
  telemetry_tags: ["assistant", "llm", "timeout"]

# Unexpected error from the LLM provider during streaming
- error_code: 12011
  error_type: system_error
  error_group: assistant
  severity: high
  default_message: An unexpected error occurred while communicating with the model.
  user_action: Retry your message. If this persists, contact support.
  retriable: true
  telemetry_tags: ["assistant", "llm"]

# Signals are not available for the requested assistant command target
- error_code: 12012
  error_type: not_found_error
  error_group: assistant
  severity: low
  default_message: Signals are not available for this target.
  user_action: Generate signals and try again.
  http_status_code: 404
  telemetry_tags: ["assistant", "signals"]

# Delegated turn identifiers do not match the hidden conversation identity
- error_code: 12013
  error_type: data_validation_error
  error_group: assistant
  severity: low
  default_message: The delegated turn identifiers do not match the conversation.
  user_action: Retry the request from the originating O11y Assistant turn.
  http_status_code: 400
  telemetry_tags: ["assistant", "validation"]
