  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Cannot recompute metrics because the number of matching steps exceeds the allowed limit.
  user_action: Refine your filters to reduce the number of steps before recomputing metrics.
  http_status_code: 422
  retriable: false
  telemetry_tags: ["metrics", "recompute", "limit"]

# Metrics-specific: LLM Provider file upload failed
- error_code: 2017
  error_type: llm_api_error
  error_group: metrics
  severity: high
  default_message: File upload(s) to LLM Provider failed.
  user_action: Update LLM Provider configuration.
  retriable: false
  telemetry_tags: ["metrics", "file_upload"]

# =============================================================================
# SECTION 3: PLAYGROUND & EXPERIMENTS ERRORS (3000-3999)
# =============================================================================
#
# Description: Errors specific to Playground and Experiments features. These
#              include prompt configuration errors, experiment setup failures,
#              and playground-specific validation errors.
#
# When to add here:
#   - Prompt configuration errors
#   - Experiment setup/configuration failures
#   - Playground-specific validation errors
#   - Experiment run failures
#
# =============================================================================

# Playground-specific: Prompt settings missing
- error_code: 3000
  error_type: configuration_error
  error_group: playground
  severity: high
  default_message: Prompt configuration is missing required fields.
  user_action: Reconfigure the playground prompt settings and retry.
  http_status_code: 422
  message_patterns:
    - "prompt settings not found"
    - "prompt configuration missing"
  telemetry_tags: ["playground"]

# Experiment already exists
- error_code: 3501
  error_type: data_validation_error
  error_group: experiment
  severity: medium
  default_message: An experiment with this name already exists for this project.
  user_action: Please use a different experiment name.
  http_status_code: 400
  message_patterns:
    - "already exists"
    - "experiment.*already exists"
  telemetry_tags: ["experiment"]

# Experiment not found
- error_code: 3502
  error_type: not_found_error
  error_group: experiment
  severity: medium
  default_message: The requested experiment could not be found.
  user_action: Verify the experiment ID and try again.
  http_status_code: 400
  message_patterns:
