# =============================================================================
# GALILEO ERROR CATALOG
# =============================================================================
#
# This file contains the canonical error definitions for the Galileo platform.
# Each error entry includes error codes, messages, user actions, and metadata
# used for classification, documentation, and customer-facing error display.
#
# Error Code Ranges (see ERROR_CODE_RANGES.md for details):
#   - 1000-1499: Shared & customer-facing errors (used across all features)
#   - 2000-2499: Metrics-specific errors
#   - 3000-3499: Playground errors
#   - 3500-3999: Experiment errors
#   - 4000-4499: Dataset errors
#   - 5000-5499: Logstream Insights (LSI) errors
#   - 6000-6499: Protect (security/guardrails) errors
#   - 7000-7499: Integrations errors
#   - 8000-8999: Reserved for future features (training, observe, etc.)
#
# Schema: See ErrorCatalogEntry model in orbit/libs/python/error_management/models/
#
# =============================================================================
# ⚠️  REQUIRED FIELDS FOR ALL ERROR ENTRIES
# =============================================================================
#
# The following 6 fields are REQUIRED for every error entry. Missing any of
# these fields will cause validation failures and result in poor SDK/UI
# experience for customers.
#
# REQUIRED FIELDS:
#   1. error_code: int
#      - Unique numeric identifier (e.g., 1000, 1001, 2000, 3000)
#      - Must be within the correct range for the error_group
#
#   2. error_type: ErrorType
#      - Enum value: credentials_error, llm_api_error, data_validation_error,
#        system_error, not_found_error, configuration_error, uncataloged_error
#
#   3. error_group: str
#      - Feature grouping: "shared", "metrics", "playground", "dataset", "lsi"
#      - Must match the error_code range (e.g., 2000-2999 → "metrics")
#
#   4. severity: ErrorSeverity
#      - Enum value: "low", "medium", "high", "critical"
#      - Used for UI ordering and alerting
#
#   5. default_message: str
#      - Customer-facing error message (fallback if no custom message)
#      - Should be clear, actionable, and user-friendly
#      - Never expose raw Python/third-party exception messages
#
#   6. user_action: str
#      - Concise guidance shown to customers (e.g., "Retry in 60 seconds")
#      - Used for UI buttons and call-to-action text
#      - Critical for good customer experience
#
# OPTIONAL FIELDS (but recommended):
#   - http_status_code: int (preferred HTTP status, e.g., 401, 404, 422)
#   - exception_class: str (dotted path, e.g., "setgalileo.exceptions.data.DataError")
#   - message_patterns: List[str] (regex patterns for classification)
#   - documentation_link: HttpUrl (link to public docs)
#   - retriable: bool (default: false)
#   - blocking: bool (default: false)
#   - telemetry_tags: List[str] (for analytics)
#
# VALIDATION:
#   - All entries are validated against ErrorCatalogEntry schema on startup
#   - Missing required fields will cause catalog load failure
#   - Invalid error_code ranges will be caught by tests
#   - Duplicate error_codes will be caught by validation
#
# =============================================================================

# =============================================================================
# SECTION 1: SHARED ERRORS (1000-1999)
# =============================================================================
#
# Description: Common errors used across all features (Metrics, Playground,
#              Experiments, Dataset, LSI). These are high-frequency errors that
#              affect multiple features.
#
# When to add here:
#   - Authentication/authorization failures
#   - LLM provider errors (rate limits, timeouts, parsing)
#   - System/infrastructure errors
#   - Resource not found errors
#   - Data validation errors that apply to multiple features
#
# =============================================================================

- error_code: 1000
  error_type: uncataloged_error
  error_group: shared
  severity: high
  default_message: An unexpected error occurred. Our team has been notified.
  user_action: Please retry or contact support with the error details.
  retriable: false
  telemetry_tags: ["fallback"]

# Authentication failures (API + integrations)
- error_code: 1001
  error_type: credentials_error
  error_group: shared
  severity: high
  default_message: Authentication failed. Check your credentials and try again.
  user_action: Verify API keys or credentials in integration settings.
  http_status_code: 401
  exception_class: setgalileo.exceptions.credentials.CredentialsError
  message_patterns:
    - "authentication"
    - "invalid api key"
    - "unauthorized"
    - "expired credential"
    - "401"
  telemetry_tags: ["auth"]

# Rate limit / quota exceeded
- error_code: 1002
  error_type: llm_api_error
  error_group: shared
  severity: high
  default_message: Provider rate limit exceeded. Please retry after a short wait.
  user_action: Reduce request frequency or upgrade quota.
  retriable: true
  http_status_code: 429
  exception_class: setgalileo.exceptions.llm.LLMError
  message_patterns:
    - "rate limit"
    - "quota exceeded"
    - "too many requests"
    - "usage limit"
  telemetry_tags: ["ratelimit"]

# Context window / payload too large
- error_code: 1003
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: Payload exceeds the provider's context window.
  user_action: Shorten the prompt or split it into smaller requests.
  message_patterns:
    - "context.*limit"
    - "token limit"
    - "input too long"
    - "max_tokens"
  telemetry_tags: ["context"]

# Provider response malformed (JSON parse, missing attributes)
- error_code: 1004
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: LLM Provider response could not be parsed.
  user_action: Retry the job; if this recurs, contact support with the run ID.
  retriable: true
  blocking: false
  exception_class: json.decoder.JSONDecodeError
  message_patterns:
    - "failed to parse json"
    - "jsondecodeerror"
    - "failed to parse response"
    - "failed to extract response"
    - "missing completion"
    - "attribute error"
  telemetry_tags: ["parsing"]

# Transient transport errors (timeouts, connection issues)
- error_code: 1005
  error_type: system_error
  error_group: shared
  severity: medium
  default_message: Temporary connectivity issue communicating with the provider.
  user_action: Retry the request; check provider status if it persists.
  retriable: true
  blocking: true
  message_patterns:
    - "timeout"
    - "connection refused"
    - "connect error"
    - "readtimeout"
    - "socket.gaierror"
  telemetry_tags: ["transport"]

# Resource not found (job, project, scorer, etc.)
- error_code: 1006
  error_type: not_found_error
  error_group: shared
  severity: medium
  default_message: The requested resource could not be found.
  user_action: Verify the identifier and try again.
  http_status_code: 404
  message_patterns:
    - "not found"
    - "does not exist"
    - "missing"
  telemetry_tags: ["notfound"]

# Integration Configuration Error (e.g., Databricks, Azure)
- error_code: 1007
  error_type: credentials_error
  error_group: shared
  severity: high
  default_message: Integration credentials are invalid or expired.
  user_action: Update the integration credentials and retry.
  message_patterns:
    - "databricks.*auth"
    - "token invalid"
    - "integration.*authentication"
  telemetry_tags: ["integrations"]

# Generic Configuration/Validation Error (e.g., bad input, resource conflict)
- error_code: 1008
  error_type: system_error
  error_group: shared
  severity: high
  default_message: Temporary issue fetching insights. Please retry shortly.
  user_action: Retry after a few minutes or contact support if it persists.
  retriable: true
  message_patterns:
    - "clickhouse"
    - "database connection"
    - "failed to fetch data"
  telemetry_tags: ["infra"]

# Data Ingestion Error
- error_code: 1009
  error_type: system_error
  error_group: shared
  severity: high
  default_message: Data ingestion failed due to an internal error.
  user_action: Retry the operation; if it persists, contact support with the run ID.
  retriable: false
  blocking: true
  exception_class: api.api.exceptions.data_ingestion_exception.DataIngestionException
  telemetry_tags: ["ingestion"]

# Internal HTTP Error (e.g., GalileoHTTPException)
- error_code: 1010
  error_type: system_error
  error_group: shared
  severity: high
  default_message: Internal HTTP request failed while processing this job.
  user_action: Retry the request; if the issue continues, contact support.
  retriable: true
  blocking: true
  exception_class: galileo_core.exceptions.http.GalileoHTTPException
  telemetry_tags: ["http"]


# Already shared with target
- error_code: 1011
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: The resource is already shared with the specified user or group.
  user_action: Consider updating the existing share permissions instead.
  http_status_code: 422

# Professional email validation
- error_code: 1012
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: Personal email providers are not allowed.
  user_action: Work email is required to create an account.
  http_status_code: 422

# Endpoint does not support email-based sharing
- error_code: 1013
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: This endpoint does not support sharing via user_email; please provide user_id.
  user_action: Use user_id instead of user_email for this endpoint.
  http_status_code: 422
  message_patterns:
    - "does not support.*user_email"
    - "provide user_id"
  telemetry_tags: ["collaboration", "validation"]

# Same user specified with conflicting roles
- error_code: 1014
  error_type: data_validation_error
  error_group: shared
  severity: medium
  default_message: The request references the same user multiple times.
  user_action: Ensure each user is specified only once.
  http_status_code: 422
  telemetry_tags: [ "collaboration", "validation" ]

# =============================================================================
# SECTION 2: METRICS ERRORS (2000-2999)
# =============================================================================
#
# Description: Errors specific to the Metrics feature. These include scorer
#              configuration errors, metric computation failures, and metrics-
#              specific validation errors.
#
# When to add here:
#   - Scorer configuration/misconfiguration errors
#   - Metric computation failures
#   - Metrics-specific validation errors
#   - Batch/job processing errors in metrics context
#
# =============================================================================

# Metrics-specific: Scorer misconfiguration
- error_code: 2000
  error_type: data_validation_error
  error_group: metrics
  severity: high
  default_message: Metric job failed due to missing scorer settings.
  user_action: Provide scorer settings for this job and retry.
  http_status_code: 422
  message_patterns:
    - "scorer settings not found"
    - "task type not found"
    - "invalid scorer config"
  telemetry_tags: ["metrics"]

# Metrics-specific: Invalid JSON format in request parameters
- error_code: 2001
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Invalid JSON format in request parameter.
  user_action: Check that filters and sort parameters are valid JSON.
  http_status_code: 422
  message_patterns:
    - "invalid json format"
    - "json decode error"
    - "JSONDecodeError"
  telemetry_tags: ["metrics", "validation"]

# Metrics-specific: Scorer file size exceeded
- error_code: 2002
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Scorer file exceeds maximum allowed size of 1 MB.
  user_action: Reduce the scorer file size and try again.
  http_status_code: 413
  message_patterns:
    - "file exceeds maximum"
    - "file too large"
    - "size limit exceeded"
  telemetry_tags: ["metrics", "validation"]

# Metrics-specific: Invalid request parameter value
- error_code: 2003
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Invalid request parameters.
  user_action: Check your request parameters and try again.
  http_status_code: 422
  message_patterns:
    - "invalid.*parameter"
    - "invalid starting_token"
    - "must be an integer"
  telemetry_tags: ["metrics", "validation"]

# Metrics-specific: Scorer version mismatch
- error_code: 2004
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: The scorer version does not belong to the specified scorer.
  user_action: Verify that the scorer version ID matches the scorer and try again.
  http_status_code: 422
  message_patterns:
    - "does not belong to scorer"
    - "scorer version.*mismatch"
  telemetry_tags: ["metrics", "scorer_feedback"]

# Metrics-specific: Scorer feedback queue locked
- error_code: 2005
  error_type: data_validation_error
  error_group: metrics
  severity: medium
  default_message: Cannot perform this operation while the metric feedback queue is not accepting new feedback.
  user_action: Please either let the feedback queue finish applying to the metric, or abort the generating/reviewing feedback queue.
  http_status_code: 409
  message_patterns:
    - "queue is"
    - "feedback queue is"
    - "non-pending queue"
    - "cannot add feedback"
    - "cannot create scorer version"
  telemetry_tags: ["metrics", "scorer_feedback"]

# =============================================================================
# SECTION 3: PLAYGROUND & EXPERIMENTS ERRORS (3000-3999)
# =============================================================================
#
# Description: Errors specific to Playground and Experiments features. These
#              include prompt configuration errors, experiment setup failures,
#              and playground-specific validation errors.
#
# When to add here:
#   - Prompt configuration errors
#   - Experiment setup/configuration failures
#   - Playground-specific validation errors
#   - Experiment run failures
#
# =============================================================================

# Playground-specific: Prompt settings missing
- error_code: 3000
  error_type: configuration_error
  error_group: playground
  severity: high
  default_message: Prompt configuration is missing required fields.
  user_action: Reconfigure the playground prompt settings and retry.
  http_status_code: 422
  message_patterns:
    - "prompt settings not found"
    - "prompt configuration missing"
  telemetry_tags: ["playground"]

# Experiment already exists
- error_code: 3501
  error_type: data_validation_error
  error_group: experiment
  severity: medium
  default_message: An experiment with this name already exists for this project.
  user_action: Please use a different experiment name.
  http_status_code: 400
  message_patterns:
    - "already exists"
    - "experiment.*already exists"
  telemetry_tags: ["experiment"]

# Experiment not found
- error_code: 3502
  error_type: not_found_error
  error_group: experiment
  severity: medium
  default_message: The requested experiment could not be found.
  user_action: Verify the experiment ID and try again.
  http_status_code: 400
  message_patterns:
    - "experiment not found"
  telemetry_tags: ["experiment"]

# Experiment not associated with project
- error_code: 3503
  error_type: data_validation_error
  error_group: experiment
  severity: medium
  default_message: The experiment is not associated with the specified project.
  user_action: Make sure you're viewing the correct project. The experiment may have been moved or deleted.
  http_status_code: 400
  message_patterns:
    - "not associated with.*project"
    - "experiment.*not associated"
  telemetry_tags: ["experiment"]

# Prompt template version required
- error_code: 3504
  error_type: configuration_error
  error_group: experiment
  severity: high
  default_message: Prompt template version ID is required to trigger experiment.
  user_action: Select a prompt template from the dropdown, or create a new template if needed.
  http_status_code: 400
  message_patterns:
    - "prompt template version.*required"
    - "template version.*required"
  telemetry_tags: ["experiment"]

# Task type mismatch
- error_code: 3505
  error_type: data_validation_error
  error_group: experiment
  severity: medium
  default_message: The experiment task type does not match the project type.
  user_action: Create this experiment in a compatible project, or change the experiment type to match this project.
  http_status_code: 400
  message_patterns:
    - "task type.*cannot be created"
    - "task type.*does not match"
  telemetry_tags: ["experiment"]

# Playground name already exists
- error_code: 3006
  error_type: data_validation_error
  error_group: playground
  severity: medium
  default_message: A playground with this name already exists in this project.
  user_action: Try a different name, or turn on auto-naming to add a unique suffix.
  http_status_code: 400
  message_patterns:
    - "name.*already exists"
    - "playground.*already exists"
  telemetry_tags: ["playground"]

# Playground run not found
- error_code: 3007
  error_type: not_found_error
  error_group: playground
  severity: medium
  default_message: The playground run couldn't be found.
  user_action: Check your experiment history for available runs, or start a new one.
  http_status_code: 404
  message_patterns:
    - "run.*not found"
    - "job.*not found"
  telemetry_tags: ["playground"]

# Playground prompt not found
- error_code: 3008
  error_type: not_found_error
  error_group: playground
  severity: medium
  default_message: This prompt doesn't exist in the playground.
  user_action: Add a new prompt or select from your existing prompts.
  http_status_code: 404
  message_patterns:
    - "prompt.*not found"
  telemetry_tags: ["playground"]

# Playground not found
- error_code: 3009
  error_type: not_found_error
  error_group: playground
  severity: medium
  default_message: This playground doesn't exist or was deleted.
  user_action: Go back to your project and select an existing playground, or create a new one.
  http_status_code: 404
  message_patterns:
    - "playground.*not found"
  telemetry_tags: ["playground"]

# Playground snapshot not found
- error_code: 3010
  error_type: not_found_error
  error_group: playground
  severity: medium
  default_message: This snapshot doesn't exist or was deleted.
  user_action: Check your run history for available snapshots to restore.
  http_status_code: 404
  message_patterns:
    - "snapshot.*not found"
  telemetry_tags: ["playground"]

# Invalid dataset version
- error_code: 3511
  error_type: not_found_error
  error_group: experiment
  severity: high
  default_message: The specified dataset version does not exist.
  user_action: Select a different version from the dataset version dropdown, or use the latest version.
  http_status_code: 404
  message_patterns:
    - "dataset version.*not found"
    - "version.*not found for dataset"
  telemetry_tags: ["experiment", "datasets"]

# =============================================================================
# SECTION 4: DATASET ERRORS (4000-4999)
# =============================================================================
#
# Description: Errors specific to the Dataset feature. These include dataset
#              upload failures, dataset validation errors, and dataset processing
#              errors.
#
# When to add here:
#   - Dataset upload/ingestion failures
#   - Dataset validation errors (format, schema, size)
#   - Dataset processing errors
#   - Dataset export errors
#
# Note: Error codes in this range are reserved for future Dataset-specific errors.
#       Add new entries below as needed.
#
# =============================================================================

# Failed to acquire dataset lock
- error_code: 4000
  error_type: system_error
  error_group: dataset
  severity: medium
  default_message: Could not acquire lock for dataset operation.
  user_action: Wait for other operations to complete and try again.
  http_status_code: 423

# Too many records to copy to dataset
- error_code: 4001
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Too many records to copy to the dataset.
  user_action: Select fewer records to copy and try again.
  http_status_code: 422

# Dataset prompt template missing
- error_code: 4002
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Either prompt_template_version_id or prompt_template must be provided.
  user_action: Provide either a prompt template version ID or a prompt template string.
  http_status_code: 400

# Dataset prompt template empty
- error_code: 4003
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Prompt template is empty.
  user_action: Provide a non-empty prompt template.
  http_status_code: 400

# Dataset prompt template invalid
- error_code: 4004
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Prompt template is invalid.
  user_action: Check the prompt template format and try again.
  http_status_code: 422

# Dataset contains reserved column names
- error_code: 4005
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Dataset columns cannot contain reserved column names.
  user_action: Remove or rename columns with reserved names and upload again.
  http_status_code: 422

# Dataset contains duplicate columns
- error_code: 4006
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Dataset columns cannot contain duplicates.
  user_action: Remove duplicate column names and upload again.
  http_status_code: 422

# Dataset missing standard columns
- error_code: 4007
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Dataset is missing required standard columns.
  user_action: Ensure the dataset has the required standard columns.
  http_status_code: 422

# Dataset cannot have both file and dataset ID
- error_code: 4008
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: You cannot provide both a file and a dataset ID to copy from.
  user_action: Provide either a file upload or a dataset ID to copy, not both.
  http_status_code: 422

# Column mapping only allowed for draft datasets
- error_code: 4009
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Column mapping can only be applied to draft datasets.
  user_action: Create a new draft dataset or work with the existing column structure.
  http_status_code: 422

# Dataset ETag mismatch
- error_code: 4010
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: ETag does not match the current entity tag of the resource.
  user_action: Refresh the dataset and retry your operation.
  http_status_code: 412

# Draft datasets do not have versions
- error_code: 4011
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Draft datasets do not have versions.
  user_action: Finalize the dataset before working with versions.
  http_status_code: 422

# Column mapping validation failed
- error_code: 4012
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Column mapping validation failed. No columns were provided for mapping.
  user_action: Provide at least one column mapping for input, ground_truth, generated_output, or metadata.
  http_status_code: 422
  telemetry_tags: ["dataset", "column_mapping", "validation"]

# Dataset column validation failed
- error_code: 4013
  error_type: data_validation_error
  error_group: dataset
  severity: medium
  default_message: Dataset column validation failed. The 'input' column is required, or invalid columns are present.
  user_action: Ensure your dataset contains the 'input' column. Optional columns are ground_truth, generated_output, and metadata.
  http_status_code: 422
  telemetry_tags: ["dataset", "schema", "validation"]

